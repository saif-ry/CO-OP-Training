<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | المدينة الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        /* تنسيقات مخصصة لمركزة نموذج تسجيل الدخول تتوافق مع الوضع المظلم */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: white;
            border-radius: var(--card-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 5px solid var(--nca-green);
            transition: 0.3s;
        }
        body.dark-mode .login-container {
            background: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h2 {
            color: var(--nca-green);
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        body.dark-mode .form-group label {
            color: #f8fafc;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            background: #f8fafc;
            color: var(--text-dark);
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        body.dark-mode .form-group input {
            background: #0f172a;
            color: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--nca-green);
        }
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header class="main-header">

        <div class="header-right">
            <div class="logo-placeholder">🏥</div>
            <div class="header-titles">
                <h1 data-ar="المدينة الطبية | منصة التوعية بالأمن السيبراني" data-en="Medical City | Cybersecurity Portal">المدينة الطبية | منصة التوعية بالأمن السيبراني</h1>
            </div>
        </div>
        <div class="header-left">
            <button class="btn-dark-mode" id="darkModeBtn" onclick="toggleDarkMode()" title="تغيير المظهر">🌙</button>
            <button class="btn-lang" onclick="toggleLanguage()">🌐 العربية / English</button>
        </div>
    </header>

    <div class="container login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🔐</div>
                <h2 data-ar="تسجيل الدخول" data-en="Login">تسجيل الدخول</h2>
                <p data-ar="الرجاء إدخال بياناتك للوصول للحقيبة" data-en="Please enter your credentials to access the portal">الرجاء إدخال بياناتك للوصول للحقيبة</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username" data-ar="اسم المستخدم (الرقم الوظيفي)" data-en="Username (Employee ID)">اسم المستخدم (الرقم الوظيفي)</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="password" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="btn btn-login" data-ar="دخول آمن" data-en="Secure Login">دخول آمن</button>

                <div id="loginError" class="interaction-result error" style="display: none; margin-top: 1rem;">
                    <span data-ar="❌ بيانات الدخول غير صحيحة، حاول مجدداً." data-en="❌ Invalid credentials, please try again.">❌ بيانات الدخول غير صحيحة، حاول مجدداً.</span>
                </div>
            </form>

            <div class="login-footer">
                <p data-ar="نسيت كلمة المرور؟ تواصل مع الدعم الفني" data-en="Forgot password? Contact IT Support">نسيت كلمة المرور؟ تواصل مع الدعم الفني</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        // دالة التحقق من الدخول
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            // محاكاة تسجيل الدخول (اسم المستخدم: admin | كلمة المرور: 123456)
            if (user === "admin" && pass === "123456") {
                // يمكنك حفظ حالة الدخول هنا إذا أردت
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "index.html"; // التوجه للرئيسية عند النجاح
            } else {
                errorDiv.style.display = 'block';
                // إخفاء رسالة الخطأ بعد 3 ثواني
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
