<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | المدينة الطبية</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-right">
            <div class="logo-placeholder"><i class="las la-hospital"></i></div>
            <div class="header-titles">
                 <h1 data-ar="المدينة الطبية " data-en="Medical City | Cybersecurity Portal">المدينة الطبية </h1>
                <h1 data-ar=" التوعية بالأمن السيبراني" data-en="Medical City | Cybersecurity Portal"> منصة التوعية بالأمن السيبراني</h1>
            </div>
        </div>
        <div class="header-left">
            <button class="btn-theme" id="themeIcon" onclick="toggleTheme()">🌙</button>
            <button class="btn-lang" onclick="toggleLanguage()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 0.5rem 1rem; border-radius: 20px; font-weight: 600; cursor: pointer;">🌐 EN/AR</button>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-icon-box">
                <i class="las la-user-lock"></i>
            </div>

            <div class="login-header">
                <h2 data-ar="تسجيل الدخول" data-en="Login">تسجيل الدخول</h2>
                <p data-ar="أدخل بياناتك للوصول إلى المنصة التوعوية" data-en="Enter credentials to access the platform">أدخل بياناتك للوصول إلى المنصة التوعوية</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label data-ar="الرقم الوظيفي" data-en="Employee ID">الرقم الوظيفي</label>
                    <div class="input-wrapper">
                        <i class="las la-user-circle"></i>
                        <input type="text" id="username" placeholder="1111" required dir="ltr">
                    </div>
                </div>

                <div class="form-group">
                    <label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="las la-key"></i>
                        <input type="password" id="password" placeholder="••••" required dir="ltr">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span data-ar="دخول آمن" data-en="Secure Login">دخول آمن</span>
                    <i class="las la-arrow-left"></i>
                </button>

                <div id="loginError" style="display: none; color: #ef4444; font-size: 0.85rem; margin-top: 1rem; font-weight: 700;">
                    <i class="las la-exclamation-circle"></i> <span data-ar="بيانات الدخول غير صحيحة" data-en="Invalid credentials">بيانات الدخول غير صحيحة</span>
                </div>
            </form>

            <div class="login-footer">
                <p data-ar="تواجه مشكلة؟ تواصل مع الدعم الفني" data-en="Having issues? Contact IT Support">تواجه مشكلة؟ تواصل مع الدعم الفني</p>
            </div>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('preferredLanguage') || 'ar';

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            if (user === "1111" && pass === "0000") {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "index.html";
            } else {
                errorDiv.style.display = 'block';
                setTimeout(() => errorDiv.style.display = 'none', 3000);
            }
        }

        function toggleTheme() {
            const body = document.documentElement;
            const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').innerText = newTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        function applyLanguage() {
            const elements = document.querySelectorAll('[data-ar][data-en]');
            elements.forEach(el => {
                el.innerText = currentLang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-ar');
            });
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('preferredLanguage', currentLang);
            applyLanguage();
        }

        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') toggleTheme();
            applyLanguage();
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
